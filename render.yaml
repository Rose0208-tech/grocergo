services:
  - type: web
    name: grocergo
    env: node
    plan: free
    buildCommand: npm --prefix customer-frontend install && npm --prefix backend install && npm --prefix customer-frontend run build && npm --prefix backend run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./prisma/grocergo.db
